apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llmobs
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
spec:
  ingressClassName: nginx
  rules:
    - host: llmobs.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: llmobs-backend
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: llmobs-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llmobs-frontend
                port:
                  number: 80
