apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmobs-backend
  labels:
    app: llmobs-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llmobs-backend
  template:
    metadata:
      labels:
        app: llmobs-backend
    spec:
      containers:
        - name: backend
          image: llmobs-backend:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: REDIS_HOST
              value: redis
            - name: KAFKA_BOOTSTRAP
              value: redpanda:9092
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: llmobs-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmobs-frontend
  labels:
    app: llmobs-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmobs-frontend
  template:
    metadata:
      labels:
        app: llmobs-frontend
    spec:
      containers:
        - name: frontend
          image: llmobs-frontend:0.1.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
